<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Roekoe Dev gepauzeerd</title>
  <style>
    :root { --bg: #f6f3ec; --fg: #2b2b2b; --muted: #6b665c; }
    @media (prefers-color-scheme: dark) { :root { --bg: #16140f; --fg: #eeeae2; --muted: #a39d90; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 32rem; padding: 24px 16px; text-align: center; }
    h1 { font-size: 1.5rem; margin: 0 0 0.75rem; }
    p { line-height: 1.5; margin: 0.5rem 0; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>🕊️ Roekoe Dev is gepauzeerd</h1>
    <p>De demo met de dev-features staat tijdelijk uit. Hier draait niets.</p>
    <p>Je demohok blijft bewaard in deze browser en is er terug zodra Dev weer aan staat.</p>
  </main>
</body>
</html>
